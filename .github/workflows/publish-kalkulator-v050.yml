name: Publish Kalkulator v0.5.0 Beta
on:
  push:
    branches: [main]
    paths:
      - "release-staging/v0.5.0-beta/READY"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release staging
        uses: actions/checkout@v4
      - name: Reconstruct and verify APK
        shell: bash
        run: |
          mkdir -p dist
          cat release-staging/v0.5.0-beta/chunks/chunk_*.txt | base64 --decode > dist/Kalkulator-Android-v0.5.0-beta-features-debug.apk
          echo "7525719649f3a1bb530068e9a274f93ba8d3817e84af14005facd03c802be7ed  dist/Kalkulator-Android-v0.5.0-beta-features-debug.apk" | sha256sum --check --strict
          test "$(stat -c%s dist/Kalkulator-Android-v0.5.0-beta-features-debug.apk)" -eq 1001349
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v0.5.0-beta" \
            "dist/Kalkulator-Android-v0.5.0-beta-features-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --prerelease \
            --title "Kalkülatör v0.5.0 Beta" \
            --notes-file "release-staging/v0.5.0-beta/RELEASE_NOTES.md"
